name: Build xPressTap

on:
  push:
    branches: [ xpresstap-main, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ xpresstap-main ]

jobs:
  build-debug:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xpresstap-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-release:
    name: Release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/xpresstap-release-key.jks

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/xpresstap-release-key.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: xpresstap-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fdroid-check:
    name: F-Droid compatibility check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for proprietary SDKs
        run: |
          echo "Checking for proprietary dependencies..."
          ! grep -r "firebase" app/src --include="*.kt" --include="*.kts" || (echo "FAIL: firebase found" && exit 1)
          ! grep -r "google-services" app/src --include="*.kt" --include="*.kts" || (echo "FAIL: google-services found" && exit 1)
          ! grep -r "crashlytics" app/src --include="*.kt" --include="*.kts" || (echo "FAIL: crashlytics found" && exit 1)
          echo "F-Droid check passed — no proprietary SDKs found"

      - name: Validate F-Droid metadata
        run: |
          python3 -c "import yaml; yaml.safe_load(open('metadata/com.xpresstap.keyboard.yml'))" \
            && echo "F-Droid metadata YAML is valid"
