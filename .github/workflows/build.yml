name: Build xPressTap

on:
  push:
    branches: [ xpresstap-main, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ xpresstap-main ]

jobs:
  build-debug:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xpresstap-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-release:
    name: Release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Setup signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS=$RUNNER_TEMP/xpresstap-release-key.jks
          USE_PROVIDED=false

          # Try to decode and validate the provided keystore
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KS" 2>/dev/null || true
            if keytool -list -keystore "$KS" -storepass "$KS_PASS" -noprompt 2>/dev/null; then
              echo "Provided keystore is valid"
              USE_PROVIDED=true
            else
              echo "Provided keystore failed validation — generating temporary key for internal testing"
              rm -f "$KS"
            fi
          fi

          if [ "$USE_PROVIDED" = "false" ]; then
            keytool -genkey -v -keystore "$KS" \
              -alias xpresstap -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=xPressTap Internal, O=xPressTap, C=US" \
              -storetype PKCS12 -noprompt
            echo "SIGNING_KEY_ALIAS=xpresstap"    >> $GITHUB_ENV
            echo "SIGNING_STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=android"   >> $GITHUB_ENV
          else
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"   >> $GITHUB_ENV
            echo "SIGNING_STORE_PASSWORD=$KS_PASS" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=$KEY_PASS"  >> $GITHUB_ENV
          fi
          echo "SIGNING_STORE_FILE=$KS" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: xpresstap-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fdroid-check:
    name: F-Droid compatibility check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for proprietary SDKs
        run: |
          echo "Checking for proprietary dependencies..."
          ! grep -r "firebase" app/src --include="*.kt" --include="*.kts" || (echo "FAIL: firebase found" && exit 1)
          ! grep -r "google-services" app/src --include="*.kt" --include="*.kts" || (echo "FAIL: google-services found" && exit 1)
          ! grep -r "crashlytics" app/src --include="*.kt" --include="*.kts" || (echo "FAIL: crashlytics found" && exit 1)
          echo "F-Droid check passed — no proprietary SDKs found"

      - name: Validate F-Droid metadata
        run: |
          python3 -c "import yaml; yaml.safe_load(open('metadata/com.xpresstap.keyboard.yml'))" \
            && echo "F-Droid metadata YAML is valid"
